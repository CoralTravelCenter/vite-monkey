<div class="popmechanic-reset layout-container-limit center" id="popmechanic-form">
    <div class="popmechanic-main">
        <div class="popmechanic-content subscribe">

            <div class="visual-icon">
                <img src="https://b2ccdn.sunmar.ru/content/subscribe-visual.webp">
            </div>

            <h3 class="popmechanic-title">Только актуальная информация</h3>
            <span class="popmechanic-sub-title">Подпишитесь, чтобы первыми узнавать о&nbsp;наших акциях и&nbsp;новостях.</span>

            <div class="field">
                <label class="subscribe__label">
                    <input class="popmechanic-input subscribe__input"
                           type="email"
                           name="email"
                           placeholder="Введите адрес электронной почты"
                           data-popmechanic-required
                           data-popmechanic-input="email"/>

                    <span class='invalid-text'>Поле обязательно для заполнения</span>
                </label>
                <button class="subscribe__submit popmechanic-button"
                        type="button"
                        name="button"
                        data-popmechanic-submit>Подписаться
                </button>
            </div>
            <div class="field checkbox-field">
                <label class="subscribe__label">
                    <input type="checkbox" class="popmechanic-input" name="checkbox" data-popmechanic-input="checkbox"
                           required>
                    <span class="subscribe__text subscribe__text--confident">
                    Вы&nbsp;даёте согласие&nbsp;на
                    <a style="text-decoration:underline" href="/soglasie-na-obrabotku-dannyh/" target="_blank">обработку персональных данных</a>
                      и&nbsp;на
                    <a style="text-decoration:underline" target="_blank"
                       href="https://cdn.coral.ru/content/doc/legal/agreement_signup_form_ctcb.pdf">получение новостей и&nbsp;предложений</a>
                </span>
                </label>
            </div>
        </div>
    </div>
    <div class="popmechanic-thankyou">
        <div class="popmechanic-title">Спасибо!</div>
        <div class="popmechanic-sub-title">Проверьте вашу почту</div>
    </div>
</div>
