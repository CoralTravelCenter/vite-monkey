<section class="not-found">
    <div class="not-found__container container">
        <div class="not-found__inner">
            <div class="not-found__content">
                <div class="not-found__code">404</div>

                <h1 class="not-found__title">
                    Ой! Вы&nbsp;забрели на&nbsp;неизведанную территорию!
                </h1>

                <p class="not-found__description">
                    Каждый турист иногда оказывается в&nbsp;неизведанных местах. <br>
                    Хотя страницу найти не&nbsp;удалось, мы&nbsp;дарим вам промокод&nbsp;ОЙ
                    на&nbsp;1&nbsp;000&nbsp;₽
                </p>

                <div class="not-found__actions">
                    <a class="not-found__button not-found__button--primary" href="/">
                        Перейти на главную
                    </a>

                    <button
                            class="not-found__button not-found__button--secondary jivo_chat__open"
                            type="button"
                            onclick="jivo_api.open()"
                    >
                        Написать в чат
                    </button>
                </div>
            </div>

            <div class="not-found__media">
                <img
                        class="not-found__image"
                        src="https://b2ccdn.coral.ru/content/landing-pages/404/404_error.webp"
                        alt="Страница не найдена"
                >
            </div>
        </div>
    </div>
