        <p class="business-button-modal__text">
            <strong>Мы вам поможем</strong>, даже если вы не смогли найти на сайте перелёт на этом тарифе.
        </p>

            - Мы скорректируем тариф на бизнес-класс и пересчитаем стоимость тура
        </p>
    </div>
    <button class="business-button-modal-action" slot="action" id="trigger-flight" type="button">
                        <span class="business-button-modal-notice" data-visible="false">
                            Мы применим промокод на этапе бронирования.
                        </span>
        Хочу бизнес-класс
    </button>
