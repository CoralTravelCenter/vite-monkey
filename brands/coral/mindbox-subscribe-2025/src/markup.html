<section class="coral subscribe">
    <div class="layout-container-limit center">
        <h3 class="subscribe__headline">Подпишитесь на наши рассылки</h3>
        <span class="subscribe__text">Получайте лучшие и самые выгодные предложения!</span>
        <form class="subscribe__form">
            <label>
                <input class="popmechanic-input" data-popmechanic-required data-popmechanic-input="email" type="email"
                       name="mail"
                       placeholder="Напишите свою почту"/>
                <button class="subscribe__submit popmechanic-button" type="button" name="button"
                        data-popmechanic-submit>
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="12" viewBox="0 0 15 12" fill="none">
                        <path d="M0.333374 6H13" stroke="white" stroke-width="1.5"/>
                        <path d="M9 1.33333L13.6667 5.99999L9 10.6667" stroke="white" stroke-width="1.5"
                              stroke-linejoin="round"/>
                    </svg>
                </button>
            </label>
        </form>
        <span class="subscribe__text subscribe__text--confident">
            Нажимая «Подписаться» вы даёте согласие на  
            <a href="/soglasie-na-obrabotku-dannyh/" target="_blank">обработку персональных данных</a>
              и на  
            <a target="_blank" href="https://cdn.coral.ru/content/doc/legal/agreement_signup_form_ctcb.pdf">получение новостей и предложений</a>
        </span>
    </div>
</section>
