<div id="welcome-to-app-popup" class="welcome-to-app" data-show="false">
    <div class="welcome-to-app-wrapper">
        <div id="swipe-trigger">
            <span></span>
        </div>
        <div class="welcome-to-app__content">
            <div class="top-block">
                <div class="welcome-to-app__logo">
                    <img src="https://b2ccdn.coral.ru/content/app-icon-2025.png" alt="Логотип мобильного приложения">
                </div>
                <h3 class="welcome-to-app__headline">
                    В&nbsp;приложении удобнее
                </h3>
                <span class="welcome-to-app__subline">
                    Идеальный отдых&nbsp;&mdash; в&nbsp;вашем телефоне
                </span>
                <ul class="welcome-to-app__list benefits-list">
                    <li class="benefits-list__item">
                        <div class="icon">
                            <img src="https://b2ccdn.coral.ru/content/benefit-check.svg" alt="Иконка галочка">
                        </div>
                        <span>Быстрый и&nbsp;удобный поиск</span>
                    </li>
                    <li class="benefits-list__item">
                        <div class="icon">
                            <img src="https://b2ccdn.coral.ru/content/benefit-check.svg" alt="Иконка галочка">
                        </div>
                        <span>Эксклюзивные скидки и&nbsp;специальные предложения</span>
                    </li>
                    <li class="benefits-list__item">
                        <div class="icon">
                            <img src="https://b2ccdn.coral.ru/content/benefit-check.svg" alt="Иконка галочка">
                        </div>
                        <span>Важные детали под рукой: рейсы, трансферы, встречи с&nbsp;гидами</span>
                    </li>
                </ul>
            </div>
            <div class="welcome-to-app__actions">
                <button id="go-to-app"
                        class="welcome-to-app__actions__button">
                    Продолжить в&nbsp;приложении
                </button>
                <button id="stay-here"
                        class="welcome-to-app__actions__button welcome-to-app__actions__button--stay">
                    Остаться на&nbsp;сайте
                </button>
            </div>
        </div>
    </div>
</div>
